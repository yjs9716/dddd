<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>계산기</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1e1e2f;
    font-family: "Segoe UI", sans-serif;
  }
  .calculator {
    width: 320px;
    background: #2b2b3d;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  .display {
    background: #15151f;
    color: #fff;
    font-size: 2rem;
    text-align: right;
    padding: 20px 16px;
    border-radius: 12px;
    margin-bottom: 16px;
    min-height: 60px;
    word-wrap: break-word;
    overflow-wrap: anywhere;
  }
  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  button {
    font-size: 1.2rem;
    padding: 18px 0;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    background: #3c3c50;
    color: #fff;
    transition: background 0.15s;
  }
  button:hover { background: #50506a; }
  button.operator { background: #ff9f43; }
  button.operator:hover { background: #ffb35e; }
  button.equal { background: #4caf50; grid-column: span 2; }
  button.equal:hover { background: #5fd364; }
  button.clear { background: #e74c3c; }
  button.clear:hover { background: #ff6353; }
</style>
</head>
<body>
  <div class="calculator">
    <div class="display" id="display">0</div>
    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">C</button>
      <button onclick="deleteLast()">⌫</button>
      <button class="operator" onclick="appendValue('%')">%</button>
      <button class="operator" onclick="appendValue('/')">÷</button>

      <button onclick="appendValue('7')">7</button>
      <button onclick="appendValue('8')">8</button>
      <button onclick="appendValue('9')">9</button>
      <button class="operator" onclick="appendValue('*')">×</button>

      <button onclick="appendValue('4')">4</button>
      <button onclick="appendValue('5')">5</button>
      <button onclick="appendValue('6')">6</button>
      <button class="operator" onclick="appendValue('-')">-</button>

      <button onclick="appendValue('1')">1</button>
      <button onclick="appendValue('2')">2</button>
      <button onclick="appendValue('3')">3</button>
      <button class="operator" onclick="appendValue('+')">+</button>

      <button onclick="appendValue('0')">0</button>
      <button onclick="appendValue('.')">.</button>
      <button class="equal" onclick="calculate()">=</button>
    </div>
  </div>

<script>
  const display = document.getElementById('display');
  let expression = '';

  function updateDisplay() {
    display.textContent = expression === '' ? '0' : expression;
  }

  function appendValue(value) {
    expression += value;
    updateDisplay();
  }

  function clearDisplay() {
    expression = '';
    updateDisplay();
  }

  function deleteLast() {
    expression = expression.slice(0, -1);
    updateDisplay();
  }

  function calculate() {
    if (!expression) return;
    try {
      const sanitized = expression.replace(/[^0-9+\-*/.%() ]/g, '');
      const result = Function('"use strict"; return (' + sanitized + ')')();
      if (result === undefined || Number.isNaN(result)) {
        throw new Error('invalid');
      }
      expression = String(result);
    } catch (e) {
      expression = 'Error';
    }
    updateDisplay();
  }

  document.addEventListener('keydown', (e) => {
    if (/[0-9+\-*/.%]/.test(e.key)) {
      appendValue(e.key);
    } else if (e.key === 'Enter' || e.key === '=') {
      calculate();
    } else if (e.key === 'Backspace') {
      deleteLast();
    } else if (e.key === 'Escape') {
      clearDisplay();
    }
  });
</script>
</body>
</html>
